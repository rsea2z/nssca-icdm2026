mvtec:
  root: "<MVTEC_ROOT>"
  format: "mvtec"
  classes: null

visa:
  # Prefer the Anomalib-converted MVTec-style directory:
  #   <root>/<class>/train/good
  #   <root>/<class>/test/good
  #   <root>/<class>/test/bad
  #   <root>/<class>/ground_truth/bad
  root: "<VISA_ROOT>"
  format: "visa"
  split_csv: null
  classes: null
